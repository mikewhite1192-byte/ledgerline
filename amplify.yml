version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - npm ci
    build:
      commands:
        # The Next.js server reads only what is in .env.production; these are ARNs, ids, names
        # and the spend cap, never a key (the keys stay in Secrets Manager).
        - env | grep -e '^DB_CLUSTER_ARN=' -e '^DB_SECRET_ARN=' -e '^DB_NAME=' -e '^COGNITO_USER_POOL_ID=' -e '^COGNITO_CLIENT_ID=' -e '^AWS_REGION=' -e '^AI_SPEND_CAP_CENTS=' -e '^META_MODEL_ID=' -e '^META_API_KEY_SECRET_NAME=' -e '^BASETEN_MODEL_ID=' -e '^BASETEN_API_KEY_SECRET_NAME=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
