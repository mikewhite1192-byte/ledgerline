version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - npm ci
    build:
      commands:
        # The Next.js server reads only what is in .env.production; these are ARNs, ids, names,
        # the spend caps and the QuickBooks and Stripe test settings, never a key or secret (those
        # stay in Secrets Manager).
        - env | grep -e '^DB_CLUSTER_ARN=' -e '^DB_SECRET_ARN=' -e '^DB_NAME=' -e '^COGNITO_USER_POOL_ID=' -e '^COGNITO_CLIENT_ID=' -e '^AWS_REGION=' -e '^AI_SPEND_CAP_CENTS=' -e '^AI_WONDER_CAP_CENTS=' -e '^META_MODEL_SPARK=' -e '^META_MODEL_WONDER=' -e '^META_MODEL_VOICE=' -e '^META_MODEL_IMAGE=' -e '^META_MODEL_SAM=' -e '^META_API_KEY_SECRET_NAME=' -e '^BASETEN_MODEL_ID=' -e '^BASETEN_API_KEY_SECRET_NAME=' -e '^FIREWORKS_MODEL_ID=' -e '^FIREWORKS_API_KEY_SECRET_NAME=' -e '^QBO_ENVIRONMENT=' -e '^QBO_MINOR_VERSION=' -e '^QBO_CLIENT_SECRET_NAME=' -e '^QBO_TOKEN_KEY_SECRET_NAME=' -e '^STRIPE_SECRET_KEY_SECRET_NAME=' -e '^SWEEP_INTERNAL_KEY_SECRET_NAME=' -e '^INBOUND_INTERNAL_KEY_SECRET_NAME=' -e '^TMS_HOOK_KEY_SECRET_NAME=' -e '^JUDGE_LOGIN_SECRET_NAME=' -e '^QBO_CLIENT_ID=' -e '^QBO_REDIRECT_URI=' -e '^QBO_ALLOWED_REALM_ID=' -e '^STRIPE_TEST_DESTINATION_ACCOUNT=' >> .env.production
        # The type and lint pass inside next build ran out of Node's default heap (at about 2 GB) on the
        # 8 GiB build host, so the build gets 4 GB and leaves the rest for the OS and its workers.
        - NODE_OPTIONS=--max-old-space-size=4096 npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
