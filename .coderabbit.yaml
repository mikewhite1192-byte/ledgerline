# AI PR reviewer config. Purpose: an independent reviewer on every PR, at a predictable cost.
#
# Cadence (one billed review per PR in the normal case). The reviewer bills per FILE per pass
# and, by default, re-reviews on EVERY push; on the original project that ran 4 to 10 rounds on busy
# PRs. So incremental review is OFF and drafts are skipped:
#   1. Before the first push, a fresh second read (read-only, severity-ranked) and one fix
#      commit. It catches most findings for free.
#   2. Push once and open the PR as a DRAFT; drafts are not reviewed (but CI minutes still bill).
#   3. Add "Second read: <head sha>" to the body, then mark it ready. That is the ONE
#      automatic review.
#   4. Batch every fix from a round into ONE commit and one push, wait about a minute, then
#      comment "@coderabbitai review" (a push right after the request cancels it).
#   5. Rounds by tier. A PR in a danger zone (rules engine, ledger, money, agent tools and
#      gateway, migrations and RLS, auth, infra) gets up to two rounds, a third only when round
#      two flagged something Major or Critical. A PR that touches only UI, copy, docs, tests or
#      seed data gets ONE round and is never re-requested. The reviewer answers any request
#      comment, so the cap is enforced where requests start (a local hook), never here.
#   6. Low-risk PRs skip this reviewer. A PR that touches only UI, copy, docs, tests or seed
#      data carries "[skip-cr]" in its title, and the author requests a GitHub Copilot review on
#      it instead (billed per request, not per file). Never on a PR that touches a danger zone, a
#      migration, auth, secrets or env, CI workflows, or billing or payments code: those always
#      get this review. Nothing here can enforce that, so the author checks the diff before tagging.
# Not reviewed (path_filters below), since each file costs and these drew most of the nitpicks:
# docs and Markdown, the lockfile, tests and test helpers, e2e, fixtures, snapshots, seed data
# files and generated files. Seed CODE stays reviewed: the demo reset runs on production.
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: true   # findings must be resolved, not scrolled past
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: false
    base_branches: ["main"]
    ignore_title_keywords: ["[skip-cr]"]   # low-risk PRs only (cadence step 6)
  path_filters:
    - "!node_modules/**"
    - "!**/*.local.*"
    - "!docs/**"
    - "!**/*.md"
    - "!package-lock.json"
    - "!**/*.test.*"
    - "!**/__tests__/**"
    - "!e2e/**"
    - "!scripts/test-db-fresh.ts"
    - "!scripts/e2e-seed.ts"
    - "!scripts/lib/fresh-seeded-db.ts"
    - "!src/test/**"
    - "!**/test-fixtures.*"
    - "!**/fixtures/**"
    - "!**/__snapshots__/**"
    - "!**/*.snap"
    - "!src/lib/seed/golden.json"
    - "!src/lib/seed/docs/manifest.json"
    - "!src/lib/seed/**/*.expected.json"
    - "!**/*.generated.*"
  path_instructions:
    # Fallback for EVERY source file, so a new file can never land with only generic review.
    - path: "{src,scripts}/**"
      instructions: |
        If this file writes to an outside system (payments, accounting, CRM, email, any
        third-party API), check: fail-closed gates (enabled / armed / dryRun re-checked on
        every path that reaches a write, never "the caller checked"); idempotency (one write
        per business event, with a named key); unknown outcomes held as unknown, never
        defaulted to empty or "not created"; whole-value read-backs, never substring matches;
        integer cents for money; no raw upstream error text in user-facing strings or ledgers;
        a start floor so it never acts on history; bounded retries.
    # Danger zones: one entry per file group that can do real damage, with its invariants.
    - path: "{db/migrations,src/lib/rules-engine,src/lib/agent,src/lib/money,infra}/**"
      instructions: |
        TIER 0: review every changed line against these invariants:
        1. Every table holding tenant data has RLS enabled and every policy scopes by tenant_id;
           no query or agent tool can read or write another tenant's rows.
        2. Every query runs inside a transaction that first sets app.tenant_id from the verified
           Cognito token; the app's database role is not the table owner and never bypasses RLS.
        3. Pay math uses integer cents only; settlement totals are deterministic and come from
           the rules engine, never from model output.
        4. Agent tools are read-only or propose-only; applying a fix requires a human approval
           record, and no agent path moves money or writes to an outside system.
        5. No secrets, client names or real driver data in code, seeds, fixtures or logs.
        6. IAM roles are least privilege; no wildcard actions on SES, S3 or Lambda.
        7. infra/ (CDK): IAM is least privilege; no secret values in templates or context, only
           Secrets Manager dynamic references.
        8. Every payment or accounting write reserves a ledger row with an idempotency key before
           the call, treats a failed or timed-out call as unknown until read back, and refuses
           to run with production credentials.
    - path: "src/config/flags.ts"
      instructions: |
        Any change to armed / dryRun / enabled / caps / start floors is a production posture
        change. An arming flip must be the only change in its PR. Removing a gate check is a
        blocking finding.
