# Blocking gates for LedgerLine. Set up on day zero, before the first feature.
#
# The mainline requires four checks (Settings > Branches > branch protection): "build + lint +
# tests + house style", "secret scan (new commits)", "semgrep (SAST + secrets rules)" and "demo
# path (local)". Never rename or remove them: a required name that stops reporting blocks every
# merge. The first is a gate job over four parallel parts; a new part goes into its needs AND its
# expected list. Third-party actions are pinned to a commit SHA (a mutable tag is a supply-chain
# door).
#
# Judgment lives in the pre-push review list and the AI reviewer; these are only the checks a
# pipeline can make objective.

name: quality-gates

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  # Nightly full semgrep scan of main, so a rule newly added to the registry packs is caught even
  # in files no pull request touches. Every other job skips this trigger at the job level, which
  # bills nothing. 07:17 UTC is the middle of the night in New York, off the top of the hour.
  schedule:
    - cron: "17 7 * * *"

concurrency:
  # The nightly run has its own group, so it never cancels or waits on a post-merge run of main.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Part 1 of the gate: typecheck, lint and the house-style check on added lines.
  static:
    name: typecheck + lint + house style
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Restores the npm download cache (~/.npm), keyed on package-lock.json.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # House rule: no em dashes in NEW lines (existing files are grandfathered). On a push the
      # change under review is the whole push, not just its last commit. Context values reach the
      # script through env, never inline in run (a branch name is attacker-influenced text).
      - name: No em dashes in new lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch -q origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          else
            BASE="$EVENT_BEFORE"
            if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
              BASE=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            fi
          fi
          if [ -z "$BASE" ]; then echo "no base to diff against; skipping"; exit 0; fi
          # Fail closed. grep exits 0 on a match, 1 on none and 2 on an error. The filters treat
          # "no match" as an empty result, so a failing git diff or grep fails this pipeline
          # (pipefail) and the step (set -e). The em dash is matched as its fixed UTF-8 bytes,
          # with no locale or PCRE involved, and its grep's exit code is read, never masked.
          filter() { grep "$@" || [ $? -eq 1 ]; }
          ADDED=$(git diff "$BASE"...HEAD | filter -E '^\+' | filter -v '^+++')
          EM_DASH=$(printf '\342\200\224')
          RC=0
          HITS=$(printf '%s\n' "$ADDED" | grep -nF "$EM_DASH") || RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "::error::em dash in added lines (house rule: commas, colons or parentheses instead)."
            echo "$HITS"
            exit 1
          elif [ "$RC" -ne 1 ]; then
            echo "::error::em dash check failed (grep exit $RC)."
            exit 1
          fi
          echo "OK: no em dashes added."

  # Part 2 of the gate. No database service in this job, so a unit test cannot reach one.
  unit:
    name: unit tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Unit tests (no database, no network)
        run: npm test

  # Part 3 of the gate.
  db:
    name: db tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway Postgres for the DB tests below. Trust auth on a container that lives for one
    # job, so no password appears anywhere.
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97 # 16.15, resolved from Docker Hub 2026-10-26
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # DB tests run against a plain Postgres 16 built FRESH from db/migrations, so a broken or
      # missing migration fails here instead of in production. The migrations go through the
      # same runner and statement splitter that apply them to Aurora, not psql.
      - name: Build the test DB from db/migrations
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: npm run db:migrate -- --target local

      - name: DB tests
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: npm run test:db

      # The five money invariants (ledger, keys, approvals, model calls, row security) on a
      # throwaway database built from every migration and seeded for both invented carriers.
      # Read-only; the database is dropped after. Fails on any FAIL or UNKNOWN line.
      - name: Money invariants on a fresh seeded database
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres
        run: npm run invariants:ci

  # Part 4 of the gate. The Next build cache holds compiler and lint output only (no database,
  # no secrets: this job has neither). An exact key hit means no source changed; otherwise the
  # newest cache for the same lockfile is restored and Next rebuilds what changed.
  build:
    name: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore the Next build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'postcss.config.mjs', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

  # The required check, under its original name: passes only when every part above succeeded.
  # It runs even when a part failed, was canceled or was skipped, and then fails, so a part that
  # never ran can never read as a pass.
  checks:
    name: build + lint + tests + house style
    needs: [static, unit, db, build]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # The parts this gate expects, by job id, sorted. A part added to needs but not here (or
          # the reverse) fails the gate instead of going unchecked.
          EXPECTED='["build","db","static","unit"]'
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$NEEDS" \
            | jq -e --argjson want "$EXPECTED" '(keys == $want) and all(.[]; .result == "success")' >/dev/null; then
            echo "OK: every part passed."
          else
            echo "::error::a part of the checks did not succeed (failed, canceled or skipped), or the list of parts changed."
            exit 1
          fi

  # The demo path in a browser: next dev on a fresh seeded database, signed in through the local
  # fake user pool, the models answered from the recorded replay (no key, no outside call). A
  # required check. It runs next dev, not the production build, so it cannot reuse the build
  # job's output; it shares the npm cache. About 2 billed minutes a run, up to 9 when the apt
  # mirror behind the browser's system packages is slow (measured Oct 27).
  demo-path:
    name: demo path (local)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97 # 16.15, resolved from Docker Hub 2026-10-26
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Read the test runner's version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-shell

      - name: Install the browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Demo path
        env:
          E2E_ADMIN_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          E2E_REPORT_FILE: test-results/demo-path.json
        run: npm run e2e

      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-path-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Every commit the change brings in, merge ancestry and merge resolutions included. The CLI
  # runs directly: the action lists only the first 30 PR commits and skips a merge's second parent.
  secrets:
    name: secret scan (new commits)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # A pinned release binary checked against a hardcoded sha256 (from the release's checksums
      # file); a mismatch fails the step.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$TARBALL" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      # On a pull request the checkout is the merge ref: parent 1 is the base, so HEAD^1..HEAD is
      # everything the PR adds. On a push, the pushed range, or the full history when the old tip
      # is unknown. Context values reach the script through env, never inline in run.
      - name: Scan new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git rev-parse -q --verify "HEAD^2" >/dev/null; then
              echo "::error::HEAD has no second parent, so the pull request's commits are unknown."
              exit 1
            fi
            RANGE="HEAD^1..HEAD"
          elif [ -n "$EVENT_BEFORE" ] && ! [[ "$EVENT_BEFORE" =~ ^0+$ ]] \
            && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${EVENT_BEFORE}..HEAD"
          else
            RANGE="HEAD"
          fi
          COUNT=$(git rev-list --count "$RANGE")
          echo "Scanning $RANGE ($COUNT commits)"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$COUNT" -eq 0 ]; then
            echo "::error::the pull request range has no commits to scan."
            exit 1
          fi
          # gitleaks exits 0 when git log fails, so a bad option or range is caught here first.
          git log --diff-merges=remerge --format=%H "$RANGE" >/dev/null
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 \
            --log-opts="--diff-merges=remerge $RANGE" .

  # Same rule packs, same excludes, any finding fails, in every mode. A pull request scans only
  # the files it changes, in semgrep's baseline mode against the base as merged (parent 1 of the
  # merge ref), so only findings the change brings in are reported; a change with no files to
  # scan passes. A push to main and the nightly run scan every file.
  semgrep:
    name: semgrep (SAST + secrets rules)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # A suppression must name the rule and say why: `nosemgrep: <rule.id> -- <reason>`.
      - name: Scan
        shell: sh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          # The baseline mode needs git. Checkout marks the repository safe only in its own
          # temporary config, and git refuses a repository another user owns, so it is marked
          # safe again here, for this step's commands only, through the environment (no git
          # config file is written).
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! git rev-parse -q --verify "HEAD^2" >/dev/null; then
              echo "::error::HEAD has no second parent, so the pull request's base is unknown."
              exit 1
            fi
            BASE=$(git rev-parse --verify "HEAD^1^{commit}")
            echo "Pull request: scanning only the files changed since $BASE:"
            git diff --name-only "$BASE" HEAD
            set -- --baseline-commit "$BASE"
          else
            echo "Full scan ($EVENT_NAME): every file."
            set --
          fi
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --config p/typescript \
            --config p/react \
            --error \
            --exclude node_modules \
            --exclude '*.local.*' \
            "$@"
